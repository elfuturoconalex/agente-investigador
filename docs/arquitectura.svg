<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E8762C"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#111827}
      .s{font-size:12px;fill:#4B5563}
      .l{font-size:12px;fill:#374151}
      .n{font-size:12px;font-weight:700;fill:#fff}
      .box{fill:#fff;stroke:#D1D5DB;stroke-width:1.2}
    </style>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="680" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#111827">Agente Investigador · Arquitectura en AWS</text>
  <text x="40" y="68" class="s">Un tema entra por la API, el agente investiga en segundo plano y deja el informe y su traza en S3.</text>

  <!-- nube AWS -->
  <rect x="210" y="100" width="790" height="550" rx="14" fill="#FFF8F2" stroke="#E8762C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="230" y="126" font-size="13" font-weight="700" fill="#C2410C">AWS · us-east-1</text>

  <!-- internet -->
  <rect x="1020" y="360" width="170" height="130" rx="14" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="1034" y="384" font-size="13" font-weight="700" fill="#4B5563">Internet</text>

  <!-- Usuario -->
  <rect x="30" y="160" width="150" height="76" rx="10" class="box"/>
  <rect x="30" y="160" width="6" height="76" rx="3" fill="#374151"/>
  <text x="48" y="190" class="t">Usuario</text>
  <text x="48" y="210" class="s">curl desde la Terminal</text>
  <text x="48" y="226" class="s">{"tema": "..."}</text>

  <!-- API Gateway -->
  <rect x="245" y="160" width="190" height="76" rx="10" class="box"/>
  <rect x="245" y="160" width="6" height="76" rx="3" fill="#8C4FFF"/>
  <text x="263" y="190" class="t">API Gateway</text>
  <text x="263" y="210" class="s">HTTP API · POST /investigar</text>
  <text x="263" y="226" class="s">límite de solicitudes</text>

  <!-- Lambda A -->
  <rect x="510" y="160" width="270" height="76" rx="10" class="box"/>
  <rect x="510" y="160" width="6" height="76" rx="3" fill="#ED7100"/>
  <text x="528" y="190" class="t">Lambda · recepción</text>
  <text x="528" y="210" class="s">valida el tema y arma el nombre</text>
  <text x="528" y="226" class="s">responde 202 al instante (el "ticket")</text>

  <!-- Lambda B -->
  <rect x="510" y="330" width="270" height="96" rx="10" class="box"/>
  <rect x="510" y="330" width="6" height="96" rx="3" fill="#ED7100"/>
  <text x="528" y="360" class="t">Lambda · agente investigador</text>
  <text x="528" y="380" class="s">loop: Claude decide → herramienta →</text>
  <text x="528" y="396" class="s">resultado, hasta guardar el informe</text>
  <text x="528" y="414" class="s">anota la traza en cada vuelta</text>

  <!-- Parameter Store -->
  <rect x="245" y="340" width="190" height="76" rx="10" class="box"/>
  <rect x="245" y="340" width="6" height="76" rx="3" fill="#E7157B"/>
  <text x="263" y="370" class="t">Parameter Store</text>
  <text x="263" y="390" class="s">llave de Tavily</text>
  <text x="263" y="406" class="s">SecureString (cifradas)</text>

  <!-- S3 -->
  <rect x="245" y="530" width="250" height="90" rx="10" class="box"/>
  <rect x="245" y="530" width="6" height="90" rx="3" fill="#7AA116"/>
  <text x="263" y="560" class="t">S3 · carpeta informes/</text>
  <text x="263" y="580" class="s">fecha_tema.md → el informe</text>
  <text x="263" y="598" class="s">fecha_tema.json → la traza</text>
  <text x="263" y="612" class="s" font-size="11">(vueltas, tokens, costo, tiempos)</text>

  <!-- CloudWatch -->
  <rect x="530" y="530" width="250" height="90" rx="10" class="box"/>
  <rect x="530" y="530" width="6" height="90" rx="3" fill="#E7157B"/>
  <text x="548" y="560" class="t">CloudWatch Logs</text>
  <text x="548" y="580" class="s">logs de cada ejecución</text>
  <text x="548" y="598" class="s">renglón TRAZA → Logs Insights</text>
  <text x="548" y="612" class="s" font-size="11">(costo y tiempo promedio)</text>

  <!-- Claude -->
  <rect x="830" y="262" width="155" height="92" rx="10" class="box"/>
  <rect x="830" y="262" width="6" height="92" rx="3" fill="#01A88D"/>
  <text x="846" y="290" class="t">Amazon Bedrock</text>
  <text x="846" y="310" class="s">Claude Haiku 4.5</text>
  <text x="846" y="326" class="s">perfil Global</text>
  <text x="846" y="342" class="s">acceso por rol de IAM</text>

  <!-- Tavily -->
  <rect x="1032" y="398" width="146" height="76" rx="10" class="box"/>
  <rect x="1032" y="398" width="6" height="76" rx="3" fill="#2563EB"/>
  <text x="1048" y="428" class="t">Tavily</text>
  <text x="1048" y="448" class="s">búsqueda web</text>
  <text x="1048" y="464" class="s">3 resultados</text>

  <!-- Flechas -->
  <!-- 1 usuario -> api -->
  <line x1="180" y1="188" x2="243" y2="188" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <!-- 2 api -> lambda A -->
  <line x1="435" y1="188" x2="508" y2="188" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <!-- respuesta 202 de regreso -->
  <path d="M510,224 L470,224 L470,262 L105,262 L105,238" fill="none" stroke="#6B7280" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#f)"/>
  <text x="200" y="280" class="l">respuesta 202: "investigación iniciada" + nombre del informe</text>

  <!-- 3 lambda A -> lambda B (async) -->
  <line x1="645" y1="236" x2="645" y2="328" stroke="#E8762C" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#fn)"/>
  <text x="655" y="278" class="l">se llama a sí misma</text>
  <text x="655" y="294" class="l">en segundo plano</text>

  <!-- 4 lambda B -> param store -->
  <line x1="510" y1="378" x2="437" y2="378" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="446" y="370" class="l">lee</text>

  <!-- 5 lambda B <-> claude -->
  <line x1="780" y1="350" x2="828" y2="320" stroke="#374151" stroke-width="1.6" marker-start="url(#f)" marker-end="url(#f)"/>
  <!-- 6 lambda B <-> tavily -->
  <line x1="780" y1="405" x2="1030" y2="436" stroke="#374151" stroke-width="1.6" marker-start="url(#f)" marker-end="url(#f)"/>

  <!-- 7 lambda B -> S3 -->
  <path d="M570,426 L570,480 L370,480 L370,528" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="380" y="472" class="l">guarda informe + traza</text>
  <!-- 8 lambda B -> CloudWatch -->
  <line x1="700" y1="426" x2="700" y2="528" stroke="#374151" stroke-width="1.6" marker-end="url(#f)"/>
  <text x="710" y="482" class="l">logs</text>

  <!-- Números -->
  <g>
    <circle cx="211" cy="188" r="11" fill="#111827"/><text x="211" y="192" class="n" text-anchor="middle">1</text>
    <circle cx="472" cy="188" r="11" fill="#111827"/><text x="472" y="192" class="n" text-anchor="middle">2</text>
    <circle cx="645" cy="306" r="11" fill="#E8762C"/><text x="645" y="310" class="n" text-anchor="middle">3</text>
    <circle cx="473" cy="396" r="11" fill="#111827"/><text x="473" y="400" class="n" text-anchor="middle">4</text>
    <circle cx="804" cy="335" r="11" fill="#111827"/><text x="804" y="339" class="n" text-anchor="middle">5</text>
    <circle cx="905" cy="420" r="11" fill="#111827"/><text x="905" y="424" class="n" text-anchor="middle">5</text>
    <circle cx="570" cy="452" r="11" fill="#111827"/><text x="570" y="456" class="n" text-anchor="middle">6</text>
    <circle cx="700" cy="452" r="11" fill="#111827"/><text x="700" y="456" class="n" text-anchor="middle">7</text>
  </g>

  <!-- IAM -->
  <text x="40" y="668" class="s">Rol de IAM de la Lambda con mínimo privilegio: leer su llave, escribir en informes/, llamarse a sí misma y usar solo Claude Haiku 4.5 en Bedrock.</text>
</svg>
